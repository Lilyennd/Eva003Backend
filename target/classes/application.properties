spring.application.name=splendor
server.port=8080
# Versionado de la API: todas las rutas quedan bajo /api/v1
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:mysql://localhost:3307/splendor
spring.datasource.username=root
spring.datasource.password=root

# El esquema lo crea database/01_schema.sql, Hibernate no toca las tablas
spring.jpa.hibernate.ddl-auto=none
# Necesario: las relaciones LAZY se leen al serializar el JSON
spring.jpa.open-in-view=true

# JSON en snake_case: idProducto -> id_producto (lo que espera el React)
spring.jackson.property-naming-strategy=SNAKE_CASE

app.jwt.secret=${JWT_SECRET:splendor-clave-de-desarrollo-cambiala-minimo-32-chars}
app.jwt.expiration-ms=7200000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
app.google.client-id=74798572074-6nt243ri944c3s6knopnrgvrp07iu8gj.apps.googleusercontent.com
