services:
  mysql:
    image: mysql:8.4
    container_name: splendor-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - splendor-data:/var/lib/mysql
volumes:
  splendor-data: